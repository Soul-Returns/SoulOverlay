# SoulOverlay Web Demo — nginx config
#
# Serves the pre-built Vue SPA and static JSON data files.
# No proxy needed — all UEX data is fetched at build time.

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
