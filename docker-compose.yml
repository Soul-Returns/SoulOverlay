services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1420:80"
    environment:
      # Get your free API key at https://uexcorp.space/api
      # Copy .env.example to .env and set UEX_API_KEY before running.
      - UEX_API_KEY=${UEX_API_KEY:-}
    restart: unless-stopped
