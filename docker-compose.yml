services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Get your free API key at https://uexcorp.space/api
        # Copy .env.example to .env and set UEX_API_KEY before building.
        UEX_API_KEY: ${UEX_API_KEY:-}
    ports:
      - "1420:80"
    restart: unless-stopped
